dataset_path: "\u6570\u636e\u96c6/BTCUSDT_5m_2y.csv"
symbol: "BTCUSDT"
interval: "5m"
random_seed: 42

label:
  horizon: 6
  upside_threshold: 0.003
  drawdown_threshold: -0.002

split:
  train_ratio: 0.70
  valid_ratio: 0.15
  test_ratio: 0.15
  gap: 6

cost:
  fee_rate_per_side: 0.001
  slippage_rate_per_side: 0.0002

thresholds:
  watch: 0.55
  buy_candidates: [0.50, 0.55, 0.60, 0.62, 0.65, 0.70]
  min_validation_signals: 50

classifier:
  objective: "binary"
  n_estimators: 500
  learning_rate: 0.03
  num_leaves: 31
  max_depth: -1
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 0.1
  class_weight: "balanced"

regressor:
  objective: "regression"
  n_estimators: 500
  learning_rate: 0.03
  num_leaves: 31
  max_depth: -1
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 0.1

paths:
  models_dir: "runs/latest/models"
  reports_dir: "runs/latest/reports"
  outputs_dir: "runs/latest/outputs"
